name: Jekyll build

on: pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@v6
      - name: Create temporary cover regression fixtures
        run: |
          cat > coverless-validation.md <<'EOF'
          ---
          layout: post
          title: Coverless validation
          date: 2026-11-02
          permalink: /coverless-validation/
          ---
          Coverless body marker.
          EOF
          cat > cover-validation.md <<'EOF'
          ---
          layout: post
          title: Cover validation
          date: 2026-11-02
          banner: /images/Example_of_a_deep_neural_network.png
          permalink: /cover-validation/
          ---
          Cover body marker.
          EOF
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1

      - name: Check generated cover markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          coverless = Path('_site/coverless-validation/index.html').read_text()
          bare = Path('_site/cover-validation/index.html').read_text()
          article = Path('_site/measuring-the-depth-of-a-model-how-deep-is-deep/index.html').read_text()
          about = Path('_site/pages/about.html').read_text()
          assert 'Coverless body marker.' in coverless
          assert 'class="article-cover"' not in coverless
          assert 'article-page--with-cover' not in coverless
          assert 'class="banner"' not in coverless
          assert bare.count('class="article-cover"') == 1
          assert '<figcaption>' not in bare
          assert 'class="banner"' not in bare
          assert article.count('class="article-cover"') == 1
          assert 'class="banner"' not in article
          assert article.index('class="article-header"') < article.index('class="article-meta"') < article.index('class="article-cover"') < article.index('class="entry article-body"')
          assert 'BrunelloN' in article and 'https://creativecommons.org/licenses/by-sa/4.0/' in article
          assert 'class="banner"' in about and '/images/RGCS_profile.jpg' in about
          assert 'class="article-cover"' not in about
          print('PASS: coverless, uncaptioned cover, credited article cover, ordering and unchanged About banner')
          PY
